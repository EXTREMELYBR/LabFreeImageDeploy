<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../web/fontes/inter-latin.woff2) format("woff2");font-weight:400 800}
html,body{margin:0;width:800px;height:600px;overflow:hidden;background:#fff;font-family:Inter,sans-serif}
.rodape{position:absolute;left:0;right:0;bottom:0;height:118px;background:linear-gradient(120deg,#1e1b4b,#312e81 55%,#0e7490);display:flex;align-items:center;padding:0 34px;box-sizing:border-box;gap:18px}
.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.logo svg{width:32px;height:32px}
.nome{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.nome span{font-weight:500;opacity:.85}
.sub{color:rgba(255,255,255,.75);font-size:15px;margin-top:5px}
.credito{position:absolute;right:30px;bottom:12px;color:rgba(255,255,255,.5);font-size:10.5px}
.faixa{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#6366f1,#06b6d4)}
</style></head><body>
<div class="faixa"></div>

</body></html>
