<!doctype html><html><head><meta charset="utf-8"><style>
/* Fundo do menu de boot (800x600). O texto do menu é desenhado pelo iPXE por cima, na área de cima
   (x 100–720, a partir de y ≈ 50): ela fica lisa e escura. Gerar o PNG:
   google-chrome --headless --hide-scrollbars --window-size=800,600 --screenshot=LabFreeImageDeploy-fundo.png fundo-boot.html */
@font-face{font-family:Jost;src:url(fontes/Jost.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;width:800px;height:600px;overflow:hidden;background:#0d1b3e;font-family:Jost,sans-serif}
.fundo{position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 100%,#16336e 0%,rgba(22,51,110,0) 60%),linear-gradient(180deg,#0d1b3e 0%,#0d1b3e 55%,#0f2250 100%)}
.topo{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#0ca8e8,#1a73e8 55%,#0d47a1)}
.marca-agua{position:absolute;right:-50px;bottom:128px;width:380px;opacity:.07;filter:grayscale(1) brightness(3)}
.rodape{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;align-items:center;padding:0 40px;gap:22px;box-sizing:border-box;
  border-top:1px solid rgba(255,255,255,.08);background:linear-gradient(90deg,rgba(13,27,62,.4),rgba(26,115,232,.18))}
.logo{width:96px}
.nome{color:#fff;font-size:34px;font-weight:600;letter-spacing:.06em;line-height:1;font-style:italic}
.nome b{font-weight:700}
.nome span{font-style:normal;font-weight:400;letter-spacing:.01em;color:#cfe3ff;margin-left:10px}
.sub{color:rgba(207,227,255,.72);font-size:15.5px;margin-top:8px;letter-spacing:.01em}
.credito{position:absolute;right:40px;bottom:14px;color:rgba(207,227,255,.4);font-size:11px;letter-spacing:.02em}
.site{position:absolute;right:40px;top:44px;color:rgba(207,227,255,.55);font-size:14px;letter-spacing:.04em}
</style></head><body>
<div class="fundo"></div><div class="topo"></div>
<img class="marca-agua" src="labfree-logo.png" alt="">
<div class="rodape"><img class="logo" src="labfree-logo.png" alt="LabFree">
<div><div class="nome"><b>LABFREE</b><span>ImageDeploy</span></div><div class="sub">Clonagem de máquinas pela rede · labfree.com.br</div></div></div>
<div class="credito">Baseado no FOG Project · GPL v3</div>
</body></html>
